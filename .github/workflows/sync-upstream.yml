name: Sync Upstream (smp46/pingvin-share-x)

on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC = 04:00 Lomé
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream tags
        run: |
          git remote add upstream https://github.com/smp46/pingvin-share-x.git
          git fetch upstream --tags --prune

      - name: Detect new upstream version
        id: detect
        run: |
          # Latest stable upstream tag (skip beta/alpha/rc)
          UPSTREAM_TAG=$(git tag --list --sort=-v:refname 'v*' | grep -v -E "ngh|beta|alpha|rc" | head -1)
          OUR_TAG=$(git tag --list --sort=-v:refname 'v*-ngh*' | head -1)
          OUR_BASE=$(echo "$OUR_TAG" | sed 's/-ngh[0-9]*$//')

          echo "upstream_tag=$UPSTREAM_TAG" >> $GITHUB_OUTPUT
          echo "our_tag=$OUR_TAG" >> $GITHUB_OUTPUT
          echo "our_base=$OUR_BASE" >> $GITHUB_OUTPUT

          echo "📊 Upstream: $UPSTREAM_TAG | Our: $OUR_TAG (base $OUR_BASE)"

          if [ "$UPSTREAM_TAG" != "$OUR_BASE" ] && [ -n "$UPSTREAM_TAG" ]; then
            echo "new=true" >> $GITHUB_OUTPUT
            # Preview conflicts by attempting merge in-memory
            git config user.email "bot@ngh.network"
            git config user.name "NGH Bot"
            git checkout -b preview-merge
            if git merge --no-commit --no-ff "$UPSTREAM_TAG" >/dev/null 2>&1; then
              echo "will_conflict=no" >> $GITHUB_OUTPUT
            else
              CONFLICTS=$(git diff --name-only --diff-filter=U | tr '\n' ',' | sed 's/,$//')
              echo "will_conflict=yes" >> $GITHUB_OUTPUT
              echo "conflicts=$CONFLICTS" >> $GITHUB_OUTPUT
              git merge --abort
            fi
          else
            echo "new=false" >> $GITHUB_OUTPUT
          fi

      - name: Telegram notification (new version detected)
        if: steps.detect.outputs.new == 'true'
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          UPSTREAM: ${{ steps.detect.outputs.upstream_tag }}
          OUR: ${{ steps.detect.outputs.our_tag }}
          CONFLICT: ${{ steps.detect.outputs.will_conflict }}
          FILES: ${{ steps.detect.outputs.conflicts }}
        run: |
          NL=$'\n'
          if [ "$CONFLICT" = "yes" ]; then
            STATUS="⚠️ CONFLIT DE MERGE prévu sur : ${FILES}${NL}Résolution manuelle requise."
          else
            STATUS="✅ Merge propre prévu (0 conflit sur les 7 fichiers NGH)."
          fi

          MSG="🐧 NGH Pingvin Fork — nouvelle version upstream${NL}${NL}Upstream: ${UPSTREAM}${NL}Notre dernier: ${OUR}${NL}${NL}${STATUS}${NL}${NL}📋 À faire (2 min):${NL}git remote add upstream https://github.com/smp46/pingvin-share-x.git # une fois${NL}git fetch upstream --tags${NL}git merge ${UPSTREAM}${NL}git tag ${UPSTREAM}-ngh1${NL}git push origin main --tags${NL}${NL}Puis GHA build + UGREEN auto-deploy (~25 min)."

          curl -sk --data-urlencode "chat_id=$CHAT_ID" \
            --data-urlencode "text=$MSG" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" | head -c 200
